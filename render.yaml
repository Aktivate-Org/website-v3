services:
  - type: web
    name: aktivate-website
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./site
    # ShopLink pages that used to live on useaktivate.com: send them to the ShopLink app
    routes:
      - type: redirect
        source: /@*
        destination: https://shop.useaktivate.com/@*
      - type: redirect
        source: /order/*
        destination: https://shop.useaktivate.com/order/*
      - type: redirect
        source: /download/*
        destination: https://shop.useaktivate.com/download/*
      - type: redirect
        source: /pay/*
        destination: https://shop.useaktivate.com/pay/*
      - type: redirect
        source: /checkout/*
        destination: https://shop.useaktivate.com/checkout/*
      - type: redirect
        source: /listing-fee/*
        destination: https://shop.useaktivate.com/listing-fee/*
      - type: redirect
        source: /find-order
        destination: https://shop.useaktivate.com/find-order
      - type: redirect
        source: /unsubscribe
        destination: https://shop.useaktivate.com/unsubscribe
      - type: redirect
        source: /img/*
        destination: https://shop.useaktivate.com/img/*
      # Pages from the old site (before 1 Nov 2026) that Google still has indexed: 301 them to the closest
      # new page so they pass their ranking on instead of returning 404.
      - type: redirect
        source: /tos
        destination: /terms/
      - type: redirect
        source: /privacy-policy
        destination: /privacy/
      - type: redirect
        source: /creator
        destination: /creators/collaboration-hub/
      - type: redirect
        source: /creators
        destination: /creators/collaboration-hub/
      - type: redirect
        source: /agency
        destination: /agencies/
      - type: redirect
        source: /campaign-management
        destination: /brands/
      - type: redirect
        source: /campaign-reporting
        destination: /agencies/
      - type: redirect
        source: /discovery
        destination: /brands/
      - type: redirect
        source: /search
        destination: /brands/
      - type: redirect
        source: /try-search
        destination: /brands/
      - type: redirect
        source: /compare
        destination: /alternatives/
      - type: redirect
        source: /keandsa
        destination: /
      - type: redirect
        source: /test
        destination: /
      - type: redirect
        source: /login
        destination: https://app.useaktivate.com/
      - type: redirect
        source: /register
        destination: https://app.useaktivate.com/
      - type: redirect
        source: /collaboration-hub
        destination: https://app.useaktivate.com/
      - type: redirect
        source: /collaboration-hub/*
        destination: https://app.useaktivate.com/
      - type: redirect
        source: /blog/content-creation-tools-elevate-your-digital-marketing-strategy
        destination: /blog/
      - type: redirect
        source: /blog/content-creation-tools-elevate-your-digital-marketing-strategy/
        destination: /blog/
      # A blog post that went live on Hashnode after the last deploy (e.g. a scheduled post) has no page yet.
      # Render only applies this when no file exists at the address, so built posts are untouched; the
      # fallback page loads the post from Hashnode in the browser until the blog-sync workflow rebuilds the site.
      - type: rewrite
        source: /blog/*
        destination: /blog/_live/index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800

  # Old blog address (blog.useaktivate.com, previously served by Hashnode).
  # Every old post URL is permanently redirected to the same slug under useaktivate.com/blog/.
  # Point the blog.useaktivate.com DNS record at this service once the new /blog/ is live.
  - type: web
    name: aktivate-blog-redirect
    runtime: static
    buildCommand: echo "redirect only"
    staticPublishPath: ./redirects/blog-subdomain
    routes:
      - type: redirect
        source: /rss.xml
        destination: https://useaktivate.com/blog/rss.xml
      - type: redirect
        source: /sitemap.xml
        destination: https://useaktivate.com/sitemap.xml
      - type: redirect
        source: /tag/*
        destination: https://useaktivate.com/blog/
      - type: redirect
        source: /newsletter
        destination: https://useaktivate.com/blog/
      - type: redirect
        source: /*
        destination: https://useaktivate.com/blog/*
